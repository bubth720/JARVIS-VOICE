name: VOICE-04 isolated laboratory
on:
  push:
    branches: ['feat/voice-04-speed-longform-emotions']
  pull_request:
    paths: ['voice04Runtime/**', 'voice04Studio/**', 'scripts/voice04/**', '.github/workflows/voice-04.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice04-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: python scripts/voice04/check_scope.py
      - run: ./gradlew :voice04Runtime:test :voiceSdk:test :studioRuntime:test :expressionRuntime:test :identityRuntime:test :pocketRuntime:test :voiceBridgeContract:test :voiceBridgeHarness:test :app:testDebugUnitTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice04-jvm-reports
          path: |
            */build/test-results/**
            */build/reports/tests/**
  audio:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM fixture only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 bash scripts/voice04/android_audio.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice04-audio-api${{ matrix.api }}
          path: voice04Studio/build/device-proof/**
  apk:
    needs: [unit, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :voice04Studio:assembleDebug :voice04Studio:lintDebug --no-daemon --max-workers=2
      - run: python scripts/voice04/verify_apk.py voice04Studio/build/outputs/apk/debug/voice04Studio-debug.apk --application-id com.jarvis.voice.studio.voice04 --build-tools "$ANDROID_HOME/build-tools/35.0.0" --report voice04Studio/build/apk-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice04-independent-laboratory-apk
          retention-days: 30
          path: |
            voice04Studio/build/outputs/apk/debug/*.apk
            voice04Studio/build/apk-verification.json
            voice04Studio/build/reports/lint-results-debug.*
