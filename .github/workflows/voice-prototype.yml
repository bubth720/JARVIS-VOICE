name: Voice Prototype 005F
on:
  pull_request:
    paths: ['voicePrototype/**', 'pocketRuntime/**', 'settings.gradle.kts', 'scripts/pocket/verify_experimental_apk.py', 'scripts/pocket/verify_stable_delivery.py', 'deliveries/mission005f/**', '.github/workflows/voice-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  apk-without-private-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build separate experimental APK; never download private/gated models
        run: ./gradlew :voicePrototype:assembleDebug :voicePrototype:assembleDebugAndroidTest :voicePrototype:lintDebug -PprototypeSidecar=true --no-daemon --max-workers=2
      - run: python scripts/pocket/verify_experimental_apk.py voicePrototype/build/outputs/apk/debug/voicePrototype-debug.apk --application-id com.jarvis.voice.voiceprototype005f --build-tools "$ANDROID_HOME/build-tools/35.0.0" --report voicePrototype/build/apk-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-prototype-005f-ci-diagnostic-apk
          retention-days: 14
          path: |
            voicePrototype/build/outputs/apk/debug/*.apk
            voicePrototype/build/outputs/apk/androidTest/debug/*.apk
            voicePrototype/build/apk-verification.json
            docs/mission005e/**
            docs/mission005f/**
      - name: Verify locally signed stable APK (public APK only, never a key/model/profile)
        if: hashFiles('deliveries/mission005f/005f-stable-apk.zip') != ''
        run: python scripts/pocket/verify_stable_delivery.py deliveries/mission005f/005f-stable-apk.zip --build-tools "$ANDROID_HOME/build-tools/35.0.0" --out voicePrototype/build/stable-delivery
      - uses: actions/upload-artifact@v4
        if: hashFiles('deliveries/mission005f/005f-stable-apk.zip') != ''
        with:
          name: jarvis-voice-prototype-005f-stable-apk
          retention-days: 30
          path: voicePrototype/build/stable-delivery/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-voice-prototype-005e-lint
          path: voicePrototype/build/reports/lint-results-debug.*
  android-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :voicePrototype:connectedDebugAndroidTest -PprototypeTestAbi=x86_64 -PprototypeSidecar=true --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-voice-prototype-005e-android-privacy
          path: |
            voicePrototype/build/reports/androidTests/**
            voicePrototype/build/outputs/androidTest-results/**
