name: VOICE Expressive V3 Android laboratory
on:
  push:
    branches: [feat/voice-expressive-v3-android, 'claude/repos-folders-analysis-sr65sg']
  pull_request:
    paths:
      - 'studioRuntime/**'
      - 'voiceStudio/**'
      - '.github/workflows/voice-expressive-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-exp-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  compile-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM gates / Android laboratory APK / lint
        run: ./gradlew -PvoiceExpressivePilot=true :studioRuntime:test :voiceStudio:assembleDebug :voiceStudio:assembleDebugAndroidTest :voiceStudio:lintDebug --no-daemon --max-workers=2
      - name: Audit standalone APK; no private weights, no internet permission
        run: python scripts/voice-exp-v3/verify_expressive_apk.py voiceStudio/build/outputs/apk/debug/voiceStudio-debug.apk --application-id com.jarvis.voice.studio.expressivev3 --build-tools "$ANDROID_HOME/build-tools/35.0.0" --report voiceStudio/build/expressive-v3-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: voice-expressive-v3-apk-laboratory
          retention-days: 30
          path: |
            voiceStudio/build/outputs/apk/debug/voiceStudio-debug.apk
            voiceStudio/build/expressive-v3-audit.json
            studioRuntime/build/test-results/test/**
            voiceStudio/build/reports/lint-results-debug.*
  android-keystore:
    needs: compile-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew -PvoiceExpressivePilot=true -PprototypeTestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.jarvis.voice.voicestudio.StudioQuickClipTests :voiceStudio:connectedDebugAndroidTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-expressive-v3-keystore-tests
          path: |
            voiceStudio/build/outputs/androidTest-results/**
            voiceStudio/build/reports/androidTests/**
