name: VOICE Binder V1 — isolated public fixtures
on:
  pull_request:
    paths: ['voiceBridgePilot/**', 'voiceBridgePilotClient/**', 'scripts/bridge/**', 'docs/mission-voice-bridge-pilot/**', 'settings.gradle.kts', '.github/workflows/voice-bridge-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-pilot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools', log-accepted-android-sdk-licenses: false }
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python scripts/bridge/verify_pilot_scope.py
      - name: Generate isolated ephemeral test signers (never historical delivery keys)
        run: |
          mkdir -p work/voice-bridge-pilot
          keytool -genkeypair -keystore work/voice-bridge-pilot/paired.jks -storepass android -keypass android -alias voice-pilot -dname 'CN=VOICE V1 isolated fixture' -keyalg RSA -keysize 2048 -validity 365
          keytool -genkeypair -keystore work/voice-bridge-pilot/rejected.jks -storepass android -keypass android -alias voice-pilot -dname 'CN=VOICE V1 refused fixture' -keyalg RSA -keysize 2048 -validity 365
          echo "VOICE_PILOT_KEYSTORE=$PWD/work/voice-bridge-pilot/paired.jks" >> "$GITHUB_ENV"
          echo "VOICE_PILOT_REFUSED_KEYSTORE=$PWD/work/voice-bridge-pilot/rejected.jks" >> "$GITHUB_ENV"
          echo 'VOICE_PILOT_KEY_PASSWORD=android' >> "$GITHUB_ENV"
      - name: JVM/Robolectric and preserved libraries; no model download
        run: ./gradlew -PincludeVoicePilot=true :voiceBridgePilot:testDebugUnitTest :voiceBridgeContract:test :voiceBridgeHarness:test :studioRuntime:test :expressionRuntime:test :identityRuntime:test :pocketRuntime:test --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 bash scripts/bridge/test_pilot_android.sh
      - name: Lint and four APK audits
        run: |
          ./gradlew -PincludeVoicePilot=true :voiceBridgePilot:lintDebug --no-daemon --max-workers=2
          python scripts/bridge/audit_pilot_apks.py --build-tools "$ANDROID_HOME/build-tools/35.0.0" > voiceBridgePilot/build/apk-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-pilot-api${{ matrix.api }}-reports
          path: |
            voiceBridgePilot/build/test-results/**
            voiceBridgePilot/build/reports/**
            voiceBridgePilot/build/apk-audit.json
            voiceBridgePilotClient/build/outputs/androidTest-results/**
      - uses: actions/upload-artifact@v4
        if: success() && matrix.api == 35
        with:
          name: voice-pilot-fixture-only-apk-ephemeral-signature
          path: voiceBridgePilot/build/outputs/apk/debug/voiceBridgePilot-debug.apk
