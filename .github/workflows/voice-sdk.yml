name: VOICE-01 local SDK
on:
  push:
    branches: ['feat/voice-01-intensive']
  pull_request:
    paths: ['voiceSdk/**', 'voiceStudio/**', 'settings.gradle.kts', '.github/workflows/voice-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android build tools only, no model or device
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preserve engines, packs, identities, historical app and bridge
        run: git diff --exit-code 04c4ca1c050c16e097d27b08831544b66121128c -- app pocketRuntime identityRuntime expressionRuntime studioRuntime voiceBridgeContract voiceBridgeHarness voiceBridgePilot voiceBridgePilotClient deliveries
      - name: SDK tests and public synthetic demonstration
        run: ./gradlew :voiceSdk:test :voiceSdk:demo :studioRuntime:test :expressionRuntime:test :identityRuntime:test :pocketRuntime:test :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Build Studio and lint without installation
        run: ./gradlew :voiceStudio:assembleDebug :voiceStudio:lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-01-test-and-lint-reports
          path: |
            voiceSdk/build/reports/**
            voiceSdk/build/test-results/**
            voiceStudio/build/reports/lint-results-debug.*
