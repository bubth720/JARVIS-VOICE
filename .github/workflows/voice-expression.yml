name: Voice Expression 005I
on:
  pull_request:
    paths: ['voiceExpression/**', 'expressionRuntime/**', 'identityRuntime/**', 'settings.gradle.kts', 'scripts/pocket/verify*', 'scripts/pocket/prepare_expression_test_audio.py', 'deliveries/mission005i/**', '.github/workflows/voice-expression.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-expression-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools', log-accepted-android-sdk-licenses: false }
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify preservation of functional applications and model bindings
        run: git diff --exit-code 1d0285ea19fa84c052ab5ce3b2f08146bcf30976 -- app pocketProbe voicePrototype voiceQuality voiceIdentity pocketRuntime identityRuntime deliveries/mission005f deliveries/mission005g deliveries/mission005h
      - name: Test JVM library and encrypted archives; private pack is never downloaded
        run: ./gradlew :expressionRuntime:test :identityRuntime:test :pocketRuntime:test --no-daemon --max-workers=2
      - name: Build independent Android application and lint
        run: ./gradlew :voiceExpression:assembleDebug :voiceExpression:assembleDebugAndroidTest :voiceExpression:lintDebug --no-daemon --max-workers=2
      - run: python scripts/pocket/verify_experimental_apk.py voiceExpression/build/outputs/apk/debug/voiceExpression-debug.apk --application-id com.jarvis.voice.voiceexpression005i --build-tools "$ANDROID_HOME/build-tools/35.0.0" --report voiceExpression/build/apk-verification.json
      - name: Audit locally signed model-free delivery (no signing key in CI)
        if: hashFiles('deliveries/mission005i/005i-experimental-apk.zip') != ''
        run: python scripts/pocket/verify_expression_delivery.py deliveries/mission005i/005i-experimental-apk.zip --build-tools "$ANDROID_HOME/build-tools/35.0.0" --out voiceExpression/build/delivery
      - uses: actions/upload-artifact@v4
        if: hashFiles('deliveries/mission005i/005i-experimental-apk.zip') != ''
        with:
          name: jarvis-voice-005i-experimental-signed-apk
          retention-days: 30
          path: |
            voiceExpression/build/delivery/**
            docs/mission005i/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-voice-005i-unit-lint-reports
          path: |
            expressionRuntime/build/reports/tests/**
            expressionRuntime/build/test-results/**
            identityRuntime/build/reports/tests/**
            identityRuntime/build/test-results/**
            pocketRuntime/build/reports/tests/**
            pocketRuntime/build/test-results/**
            voiceExpression/build/reports/lint-results-debug.*
  android-library-crypto-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools', log-accepted-android-sdk-licenses: false }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install synthetic-audio fixture encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare synthetic MP3/WAV and encrypted JVM interoperability fixture
        run: |
          python scripts/pocket/prepare_expression_test_audio.py
          IDENTITY_ARCHIVE_FIXTURE_OUT="$PWD/voiceExpression/build/generated/androidTestAssets/jvm-synthetic.jvi" ./gradlew :identityRuntime:test --tests '*VoiceIdentityArchiveTests.authenticatedRoundTrip*' --rerun-tasks --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :voiceExpression:connectedDebugAndroidTest -PprototypeTestAbi=x86_64 --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-voice-005i-android-reports
          path: |
            voiceExpression/build/reports/androidTests/**
            voiceExpression/build/outputs/androidTest-results/**
