[project]
name = "jarvis-pocket-prototype"
version = "0.1.0"
description = "Private French CPU speech prototype for JARVIS VOICE"
requires-python = ">=3.10,<3.15"
dependencies = ["pocket-tts==3.3.0", "torch==2.8.0", "psutil==7.1.0"]

[project.scripts]
jarvis-pocket = "jarvis_pocket.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_pocket"]
